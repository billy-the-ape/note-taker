# Real CI gates — PR-03 (docs/plans/mvp/MVP-03.md), replacing PR-01's placeholder job.
#
# ⚠ `name: CI`, the triggers, `concurrency` and `permissions` below are load-bearing, not cosmetics:
# `.github/workflows/claude-review.yml` starts on `workflow_run: workflows: ["CI"]`, so renaming this
# workflow (or narrowing its triggers) silently turns the Claude review off — plan §20 risk R6.
#
# A job never enters this file before the files it runs exist (MVP-03 §5): `integration` arrived with PR-04
# (a `postgres:16` service + `pnpm coverage:integration`), PR-18 added the `docker build` step inside `build`
# along with the two assertions that file makes possible (`check:env` against fixtures, and `compose config`
# interpolation), PR-19 adds `e2e`. Nothing here pushes an image, and nothing here caches except
# `actions/setup-node`'s `cache: pnpm` (MVP-03 §7).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `biome check .` over the whole workspace, then both apps' typecheck programs.
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Deliberately no `version:` input — the action takes the pnpm version from `packageManager` in
      # the root package.json, so CI runs exactly the pnpm this repo pins. It must run BEFORE
      # setup-node, which asks `pnpm store path` what to cache: caching lives on setup-node only.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # Node 22 — the pin CI reads; keep `engines` in step by hand
          cache: pnpm
      # The lockfile is committed, so CI installs exactly this tree and never resolves anything new.
      - run: pnpm install --frozen-lockfile
      # `@note-taker/contracts` will declare `exports`/`main`/`types` → `./dist` only, and a fresh
      # checkout has no dist/, so this job's `pnpm typecheck` needs the packages compiled here
      # (plan §14: this step runs in every job that typechecks or tests app code). Actions jobs are
      # separate runners with separate checkouts, so nothing `build` produces could be reused here;
      # PR-05 makes this load-bearing.
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck

  # Unit tests + coverage, with no Postgres service on purpose: `*.int.test.ts` are excluded by the
  # unit Vitest configs, and every threshold that needs a DB is measured by PR-04's `integration`
  # job. The thresholds themselves live in the Vitest configs that produce the numbers — never in CI
  # flags — so a local `pnpm coverage` goes red exactly when this job does (plan §14).
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same reason as in `quality` (see the comment there): the unit Vitest runs import the packages from
      # `dist/` too, and this runner shares no files with the other jobs.
      - run: pnpm build:packages
      - run: pnpm coverage
      # Each package writes its own gitignored `coverage/` report; collect them into the single
      # `coverage-unit/` directory .gitignore already reserves. The `packages/*` glob is pre-wired
      # for PR-05's contracts report.
      - name: Collect unit coverage
        run: |
          mkdir -p coverage-unit
          for dir in packages/*/coverage apps/*/coverage; do
            [ -d "$dir" ] || continue
            target="coverage-unit/$(basename "${dir%/coverage}")"
            mkdir -p "$target"
            cp -R "$dir/." "$target"
          done
          # A run that produced no report at all is a red gate, not an empty artifact.
          test -n "$(find coverage-unit -mindepth 1 -type f -print -quit)"
      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit
          if-no-files-found: error

  # PR-04's job — the one MVP-03's "Jobs added later" table reserves for it, and the first that needs a
  # database. It is the only place the `*.int.test.ts` suite runs and the only place the §14 row over
  # `apps/server/src/db` is measured; `unit` stays Postgres-free on purpose, which is what the
  # `.int.test.ts` exclusion in `apps/server/vitest.config.ts` is for.
  #
  # `DATABASE_URL` is set for the whole job rather than written to a `.env`: a set `DATABASE_URL` wins
  # verbatim in `databaseUrl()`, exactly as it will in a deployed container, and a CI checkout has no `.env`
  # for `loadDevEnvFile()` to read. The credentials are the throwaway pair MVP-03 prescribes for a service
  # container. The coverage threshold lives in `vitest.integration.config.ts`, never in a CI flag.
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # `postgres:16`, not `-alpine`: MVP-03's row spells it that way, and the Debian image is glibc like the
        # dev container, so the CI database sorts and compares text exactly like the one `make db-up` gives a
        # contributor instead of like musl would.
        image: postgres:16
        env:
          POSTGRES_USER: notetaker
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notetaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://notetaker:test@localhost:5432/notetaker_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Load-bearing here too, not just in `quality`: `src/test/setup.ts` boots the app under test, which
      # imports `@note-taker/contracts` from its `dist` (PR-05).
      - run: pnpm build:packages
      # `src/test/setup.ts` applies the committed migration before the first test, so a schema
      # `pnpm db:migrate` cannot apply goes red here rather than in someone's deployment.
      - run: pnpm test:integration
      - run: pnpm coverage:integration
      # This suite has one report directory (`reportsDirectory: coverage-integration` in
      # `vitest.integration.config.ts`), so it uploads directly instead of going through `unit`'s collect loop.
      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: apps/server/coverage-integration
          if-no-files-found: error

  # `pnpm build`: tsc → apps/server/dist, vite build → apps/web/dist. PR-18 added the two things this job
  # owns and no other can assert: the production env preflight against fixture files (§5 of MVP-18.md), and
  # the `docker build` step. Nothing here pushes an image — the MVP has no registry (MVP-03 §5, MVP-18 §8).
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No `build:packages` step here on purpose: the root script already is
      # `pnpm build:packages && pnpm -r --filter './apps/**' build`, so this one step compiles the packages
      # (a no-op until PR-05) and then both apps — no duplicated step, and PR-05 needs no edit here either.
      - run: pnpm build
      # PR-18 §7: the dev/CI form of the preflight is asserted **here**, where the repository's toolchain
      # exists, and never from the runbook (whose first deploy host has nothing but Docker). The fixtures are
      # reached through `DOTENV_PATH`, so the assertion is about two committed files and not about what this
      # runner happens to export. `pnpm check:env` is `NODE_ENV=production tsx scripts/check-env.ts` (PR-01's
      # inline-mode rule): the linter reads the file as data and never routes through `loadDevEnvFile()`,
      # which is a no-op in `production` by design.
      - name: check:env against the fixtures
        env:
          # The key from `scripts/fixtures/prod-no-dsn.env`, whose base64 decodes to
          # `pr18-fixture-key-not-a-secretxx!`. It is a fixture, not a secret: step 2 below is proving that
          # *filling the line in* is what turns the preflight green.
          FIXTURE_KEY: cHIxOC1maXh0dXJlLWtleS1ub3QtYS1zZWNyZXR4eCE=
        run: |
          set -euo pipefail
          report=$(mktemp -d)

          # 1. The runbook's production `.env` minus the key: non-zero, naming the same variable
          #    `docker compose … config` names, and reached before Docker is contacted at all.
          if DOTENV_PATH=scripts/fixtures/prod-missing-key.env pnpm check:env >"$report/missing.log" 2>&1; then
            echo '::error::a key-less production .env passed check:env; it must not'
            cat "$report/missing.log"
            exit 1
          fi
          grep -q 'NOTE_ENCRYPTION_KEY' "$report/missing.log" || {
            echo '::error::check:env failed without naming NOTE_ENCRYPTION_KEY'
            cat "$report/missing.log"
            exit 1
          }
          cat "$report/missing.log"

          # 2. The same file with the key filled in: exit 0. Two details make that reachable and are
          #    asserted by the fixture itself — it carries **no `NODE_ENV` entry** (compose.yml pins the
          #    mode) and **no `DATABASE_URL` line** (the `POSTGRES_*` trio satisfies the DSN rule).
          cp scripts/fixtures/prod-missing-key.env "$report/filled.env"
          printf 'NOTE_ENCRYPTION_KEY=%s\n' "$FIXTURE_KEY" >>"$report/filled.env"
          DOTENV_PATH="$report/filled.env" pnpm check:env

          # 3. The negative case of the DSN carve-out: a file with neither form fails, naming both options.
          if DOTENV_PATH=scripts/fixtures/prod-no-dsn.env pnpm check:env >"$report/nodsn.log" 2>&1; then
            echo '::error::a .env with neither DATABASE_URL nor the POSTGRES_* trio passed check:env'
            exit 1
          fi
          cat "$report/nodsn.log"
          grep -q 'DATABASE_URL' "$report/nodsn.log" || { echo '::error::the failure must name DATABASE_URL'; exit 1; }
          grep -q 'POSTGRES_USER' "$report/nodsn.log" || {
            echo '::error::the failure must name the POSTGRES_* trio as the other option'
            exit 1
          }

          # 4. The promise in `scripts/check-env.ts`'s own header — "it never echoes a value that could be key
          #    material" — asserted where it was actually broken once: a malformed line is reported by printing
          #    the offending text, and the offending text here *is* the key (an inline `#` is a comment to
          #    Compose and literal text to a sourced shell, so the line has to be named). Failure output is
          #    pasted into tickets, so the rule is: report the shape, never the value. Grepping the key out of
          #    the log is the whole test, and `cat` above/below is what a failure has to show.
          if DOTENV_PATH=scripts/fixtures/prod-redaction.env pnpm check:env >"$report/redaction.log" 2>&1; then
            echo '::error::a NOTE_ENCRYPTION_KEY line with an inline comment passed check:env; the readers disagree about its value'
            exit 1
          fi
          grep -q 'inline' "$report/redaction.log" || {
            echo '::error::the malformed-line rule was not reported, so there is nothing to check for leakage'
            cat "$report/redaction.log"
            exit 1
          }
          #    The grep uses a prefix, deliberately: the leak this guard exists for printed the *first 40
          #    characters* of a 44-character key, so grepping for the whole value would have passed a real
          #    leak. 20 characters is long enough to be distinctive about this fixture and short enough to
          #    survive any truncation the reporter applies. A failure prints the log with the match masked,
          #    because a CI log about a key leak must not itself leak the key.
          if grep -qF "${FIXTURE_KEY:0:20}" "$report/redaction.log"; then
            echo '::error::check:env printed the key it was reporting on — report shape and length, never the value'
            sed -e "s/${FIXTURE_KEY}/${FIXTURE_KEY:0:4}<REDACTED>/" "$report/redaction.log"
            exit 1
          fi
          grep -q 'not printed' "$report/redaction.log" || {
            echo '::error::the redacted preview is missing its length-only form'
            cat "$report/redaction.log"
            exit 1
          }
      # The same three properties the runbook's §2 preflight promises an operator, asserted where a runner
      # has Docker: `config` fails naming the variable, `config` succeeds once the key exists, and what it
      # composes is a DSN with host `db` on a pinned `PORT` with a `production` mode — with no `NODE_ENV` and
      # no `DATABASE_URL` in the file. `.env` is gitignored, and `config` never talks to the daemon, so no
      # container is created by any line of this step.
      - name: compose config interpolates the way DEPLOY.md says
        run: |
          set -euo pipefail
          report=$(mktemp -d)

          cp scripts/fixtures/prod-missing-key.env .env
          if docker compose --env-file .env -f docker/compose.yml config >"$report/keyless.log" 2>&1; then
            echo '::error::compose.yml accepted a .env with no NOTE_ENCRYPTION_KEY'
            exit 1
          fi
          grep -q 'NOTE_ENCRYPTION_KEY' "$report/keyless.log" || {
            echo '::error::compose must name the variable it is missing'
            cat "$report/keyless.log"
            exit 1
          }
          cat "$report/keyless.log"

          printf 'NOTE_ENCRYPTION_KEY=%s\n' cHIxOC1maXh0dXJlLWtleS1ub3QtYS1zZWNyZXR4eCE= >>.env
          docker compose --env-file .env -f docker/compose.yml config >"$report/resolved.yml"
          grep -q 'NODE_ENV: production' "$report/resolved.yml"
          grep -q 'PORT: "3000"' "$report/resolved.yml"
          # host `db` (the service name, never `localhost`) and the *service* port, whatever HOST_PORT is.
          grep -q 'DATABASE_URL: postgres://[^@]*@db:5432/' "$report/resolved.yml"
          ! grep -qE 'published: "5432"' "$report/resolved.yml"   # the db publishes nothing
      # PR-18's `docker build` step. It builds and never pushes: there is no registry in the MVP
      # (docs/plans/mvp/MVP-03.md §5, MVP-18.md §8), and an unpushed image still proves the multi-stage
      # build, the pruned install, and the contract package that has to resolve inside it.
      - name: docker build
        run: docker build --file docker/Dockerfile --tag note-taker-app:ci .
